<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="crest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg-grad)" />
  <!-- Border -->
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.3" />
  <!-- Dagger & Heart Crest -->
  <g transform="translate(96, 96) scale(0.48)">
    <!-- Heart shape behind dagger -->
    <path d="M 0,-50 C -40,-90 -90,-60 -90,-10 C -90,40 -20,80 0,110 C 20,80 90,40 90,-10 C 90,-60 40,-90 0,-50 Z" fill="none" stroke="url(#crest-grad)" stroke-width="12" stroke-linejoin="round" />
    <!-- Dagger blade -->
    <path d="M -8,-90 L 8,-90 L 12,-10 L 0,80 L -12,-10 Z" fill="url(#crest-grad)" />
    <!-- Dagger guard -->
    <path d="M -30,-10 C -15,-18 15,-18 30,-10 L 25,-2 L -25,-2 Z" fill="#f59e0b" />
    <!-- Dagger hilt / pommel -->
    <rect x="-6" y="-32" width="12" height="22" rx="2" fill="#78350f" />
    <circle cx="0" cy="-36" r="8" fill="url(#crest-grad)" />
  </g>
</svg>
